<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>한수원 레트로 갤러그</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', monospace;
            color: #fff;
            touch-action: none; /* 모바일 스크롤 방지 */
        }

        #gameWrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100%;
            max-height: 900px;
            aspect-ratio: 2 / 3;
            background-color: #050510;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        /* 시작 화면 한수원 로고 플레이스홀더 */
        #logoPlaceholder {
            width: 200px;
            height: 80px;
            border: 2px dashed #00ffff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            color: #00ffff;
            font-size: 14px;
            text-shadow: 0 0 5px #00ffff;
            background: rgba(0, 255, 255, 0.1);
        }

        h1 {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            font-size: 28px;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        h2 {
            color: #ffff00;
            font-size: 20px;
            margin-bottom: 30px;
        }

        p {
            font-size: 10px;
            line-height: 1.8;
            color: #00ffff;
            margin-bottom: 5px;
        }

        button {
            margin-top: 30px;
            padding: 15px 25px;
            font-family: inherit;
            font-size: 16px;
            color: #fff;
            background: transparent;
            border: 3px solid #00ff00;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 10px #00ff00 inset, 0 0 10px #00ff00;
            transition: all 0.2s;
        }

        button:hover, button:active {
            background: #00ff00;
            color: #000;
        }

        #uiLayer {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #fff;
            z-index: 5;
            pointer-events: none;
            text-shadow: 2px 2px 0px #000, 0 0 5px #fff;
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <!-- UI Layer: Score & Life -->
    <div id="uiLayer" class="hidden">
        <div>SCORE: <span id="scoreDisplay">0</span></div>
        <div style="color: #ff0055;">LIFE: <span id="lifeDisplay">3</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
        <!-- 한수원 로고가 들어갈 자리 -->
        <!-- 로고 이미지가 있다면 <img src="logo.png" alt="KHNP" style="max-width:200px;"> 로 대체하세요 -->
        <div id="logoPlaceholder">
            한수원(KHNP)<br>로고 이미지 영역
        </div>
        
        <h1>SPACE<br>DEFENDER</h1>
        <p>[PC]</p>
        <p>이동: 좌/우 화살표</p>
        <p>발사: 스페이스바</p>
        <br>
        <p>[MOBILE]</p>
        <p>이동: 화면 드래그</p>
        <p>발사: 화면 터치(탭)</p>
        <button id="startBtn">START GAME</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen hidden">
        <h1 style="color: #ff0000; text-shadow: 0 0 10px #ff0000;">GAME OVER</h1>
        <h2>FINAL SCORE<br><br><span id="finalScore">0</span></h2>
        <button id="restartBtn">RESTART</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const uiLayer = document.getElementById('uiLayer');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const lifeDisplay = document.getElementById('lifeDisplay');

    // 캔버스 크기 고정 (논리적 크기)
    const GAME_WIDTH = 400;
    const GAME_HEIGHT = 600;
    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    // 게임 상태
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let lives = 3;
    let frameCount = 0;
    let animationId;

    // 8비트 사운드 이펙트 생성 (Web Audio API)
    let audioCtx;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.1);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'explosion') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(10, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        }
    }

    // 엔티티 배열
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];

    // 배경 별 생성
    for (let i = 0; i < 50; i++) {
        stars.push({
            x: Math.random() * GAME_WIDTH,
            y: Math.random() * GAME_HEIGHT,
            size: Math.random() * 2 + 1,
            speed: Math.random() * 2 + 0.5
        });
    }

    // 플레이어 객체
    const player = {
        x: GAME_WIDTH / 2,
        y: GAME_HEIGHT - 60,
        width: 30,
        height: 30,
        speed: 5,
        dx: 0,
        cooldown: 0,
        draw() {
            // 우주선 그리기 (간단한 픽셀 형태)
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.moveTo(this.x, this.y - this.height / 2);
            ctx.lineTo(this.x + this.width / 2, this.y + this.height / 2);
            ctx.lineTo(this.x - this.width / 2, this.y + this.height / 2);
            ctx.fill();

            // 엔진 불꽃
            if (frameCount % 10 < 5) {
                ctx.fillStyle = '#ff9900';
                ctx.fillRect(this.x - 5, this.y + this.height / 2, 10, 8);
            }

            // [특별 요청] 우주선 위 '한수원(KHNP)' 텍스트
            ctx.fillStyle = '#ffffff';
            ctx.font = '8px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('KHNP', this.x, this.y - this.height / 2 - 10);
        },
        update() {
            this.x += this.dx;
            // 화면 밖으로 나가지 못하게
            if (this.x < this.width / 2) this.x = this.width / 2;
            if (this.x > GAME_WIDTH - this.width / 2) this.x = GAME_WIDTH - this.width / 2;
            
            if (this.cooldown > 0) this.cooldown--;
        },
        shoot() {
            if (this.cooldown <= 0) {
                bullets.push({
                    x: this.x,
                    y: this.y - this.height / 2,
                    width: 4,
                    height: 15,
                    speed: 10,
                    color: '#ffff00'
                });
                playSound('shoot');
                this.cooldown = 15; // 연사 속도 제한
            }
        }
    };

    // 키보드 입력 처리
    const keys = {};
    window.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (gameState === 'PLAYING') {
            if (e.code === 'ArrowLeft') player.dx = -player.speed;
            if (e.code === 'ArrowRight') player.dx = player.speed;
            if (e.code === 'Space') {
                player.shoot();
                e.preventDefault(); // 스페이스바 스크롤 방지
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        keys[e.code] = false;
        if (e.code === 'ArrowLeft' && player.dx < 0) player.dx = 0;
        if (e.code === 'ArrowRight' && player.dx > 0) player.dx = 0;
    });

    // 터치/마우스 입력 처리 (모바일 대응)
    const gameWrapper = document.getElementById('gameWrapper');
    let isDragging = false;

    gameWrapper.addEventListener('touchstart', (e) => {
        if (gameState !== 'PLAYING') return;
        e.preventDefault();
        isDragging = true;
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        // 스크린 비율에 맞게 좌표 변환
        const scaleX = canvas.width / rect.width;
        player.x = (touch.clientX - rect.left) * scaleX;
        player.shoot(); // 터치 시 발사
    }, { passive: false });

    gameWrapper.addEventListener('touchmove', (e) => {
        if (gameState !== 'PLAYING' || !isDragging) return;
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        player.x = (touch.clientX - rect.left) * scaleX;
    }, { passive: false });

    gameWrapper.addEventListener('touchend', () => {
        isDragging = false;
    });

    // 폭발 파티클 생성 함수
    function createExplosion(x, y, color) {
        for (let i = 0; i < 15; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                life: 30,
                color: color,
                size: Math.random() * 3 + 1
            });
        }
    }

    // 적 스폰 함수
    function spawnEnemy() {
        const size = 25;
        const x = Math.random() * (GAME_WIDTH - size * 2) + size;
        const colors = ['#ff00ff', '#00ff00', '#ff0000'];
        enemies.push({
            x: x,
            y: -30,
            width: size,
            height: size,
            speed: 1.5 + Math.random() * 1.5 + (score * 0.005), // 점수가 오를수록 속도 증가
            color: colors[Math.floor(Math.random() * colors.length)],
            sineOffset: Math.random() * Math.PI * 2
        });
    }

    // 게임 리셋
    function resetGame() {
        score = 0;
        lives = 3;
        player.x = GAME_WIDTH / 2;
        player.dx = 0;
        bullets = [];
        enemies = [];
        particles = [];
        frameCount = 0;
        updateUI();
    }

    function updateUI() {
        scoreDisplay.innerText = score;
        lifeDisplay.innerText = lives;
    }

    // 메인 게임 루프
    function update() {
        if (gameState !== 'PLAYING') return;

        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        frameCount++;

        // 별 그리기 (배경 스크롤)
        ctx.fillStyle = '#ffffff';
        stars.forEach(star => {
            star.y += star.speed;
            if (star.y > GAME_HEIGHT) {
                star.y = 0;
                star.x = Math.random() * GAME_WIDTH;
            }
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });

        // 계속 스페이스바를 누르고 있으면 연속 발사
        if (keys['Space']) {
            player.shoot();
        }

        // 플레이어 업데이트 및 그리기
        player.update();
        player.draw();

        // 총알 업데이트 및 그리기
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.y -= b.speed;
            
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x - b.width/2, b.y, b.width, b.height);

            // 화면 밖으로 나간 총알 제거
            if (b.y < 0) bullets.splice(i, 1);
        }

        // 적 스폰 로직 (시간 및 점수에 따라 간격 단축)
        let spawnRate = Math.max(30, 90 - Math.floor(score / 50));
        if (frameCount % spawnRate === 0) {
            spawnEnemy();
        }

        // 적 업데이트 및 그리기
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.y += e.speed;
            e.x += Math.sin(frameCount * 0.05 + e.sineOffset) * 1.5; // 좌우 흔들림

            // 적 그리기 (외계인 모양)
            ctx.fillStyle = e.color;
            ctx.fillRect(e.x - e.width/2, e.y - e.height/2, e.width, e.height);
            // 눈
            ctx.fillStyle = '#000';
            ctx.fillRect(e.x - 5, e.y - 3, 3, 3);
            ctx.fillRect(e.x + 2, e.y - 3, 3, 3);

            // 총알과 적 충돌 검사
            let hit = false;
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (b.x > e.x - e.width/2 && b.x < e.x + e.width/2 &&
                    b.y > e.y - e.height/2 && b.y < e.y + e.height/2) {
                    
                    createExplosion(e.x, e.y, e.color);
                    playSound('explosion');
                    score += 10;
                    updateUI();
                    
                    bullets.splice(j, 1);
                    enemies.splice(i, 1);
                    hit = true;
                    break;
                }
            }
            if (hit) continue;

            // 플레이어와 적 충돌 검사 또는 바닥에 닿음
            if (
                (Math.abs(e.x - player.x) < (e.width/2 + player.width/2 - 5) && 
                 Math.abs(e.y - player.y) < (e.height/2 + player.height/2 - 5)) ||
                e.y > GAME_HEIGHT
            ) {
                createExplosion(player.x, player.y, '#00ffff');
                playSound('explosion');
                enemies.splice(i, 1);
                lives--;
                updateUI();
                
                if (lives <= 0) {
                    gameState = 'GAMEOVER';
                    gameOverScreen.classList.remove('hidden');
                    uiLayer.classList.add('hidden');
                    document.getElementById('finalScore').innerText = score;
                }
            }
        }

        // 파티클(폭발 효과) 업데이트
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 30;
            ctx.fillRect(p.x, p.y, p.size, p.size);
            ctx.globalAlpha = 1.0;

            if (p.life <= 0) particles.splice(i, 1);
        }

        animationId = requestAnimationFrame(update);
    }

    // 버튼 이벤트 리스너
    startBtn.addEventListener('click', () => {
        initAudio();
        startScreen.classList.add('hidden');
        uiLayer.classList.remove('hidden');
        resetGame();
        gameState = 'PLAYING';
        update();
    });

    restartBtn.addEventListener('click', () => {
        gameOverScreen.classList.add('hidden');
        uiLayer.classList.remove('hidden');
        resetGame();
        gameState = 'PLAYING';
        update();
    });

    // 배경화면 초기 렌더링 (시작 전)
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    ctx.fillStyle = '#ffffff';
    stars.forEach(star => {
        ctx.fillRect(star.x, star.y, star.size, star.size);
    });

</script>
</body>
</html>
